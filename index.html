let S=JSON.parse(localStorage.getItem(KEY)||"null")||{week:1,day:"Monday",logs:{},history:[],notes:{},checkins:{},prs:{},startDate:"",units:"lb"};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(x){let e=document.getElementById("toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1400)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function K(w,d,i,s){return w+"|"+d+"|"+i+"|"+s}
function ns(p){let t=String(p).replace(/×/g,'x').replace(/\s/g,'');let m=[...t.matchAll(/(\d+)x/g)];if(m.length)return m.reduce((a,z)=>a+Number(z[1]),0);let q=t.match(/^(\d+)/);return q?Number(q[1]):1}
function comp(w,d){let z=PLAN[w][d],a=0,b=0;(z.ex||[]).forEach((x,i)=>{let n=ns(x[2]);a+=n;for(let s=0;s<n;s++)if(S.logs[K(w,d,i,s)]?.done)b++});return{a,b,p:a?Math.round(b/a*100):0}}
function page(p){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n-"+p)?.classList.add("active");({home,train,progress,history,more}[p])()}
function home(){let c=comp(S.week,S.day),ds=DAYS.map(d=>{let q=comp(S.week,d);return `<div class="card" onclick="S.day='${d}';save();page('train')"><div style="display:flex;justify-content:space-between"><div><b>${d.slice(0,3)} · ${PLAN[S.week][d].title}</b><div class="muted" style="font-size:12px">${PLAN[S.week][d].focus}</div></div><span class="pill ${q.p===100?'green':'purple'}">${q.p}%</span></div><div class="bar"><i style="width:${q.p}%"></i></div></div>`}).join("");let total=0;for(let w=1;w<=8;w++)for(let d of DAYS)total+=comp(w,d).b;document.getElementById("root").innerHTML=`<section class="hero"><div class="ey">Week ${S.week} · ${PHASE[S.week]}</div><h1>Train with intent.</h1><p class="muted">${PLAN[S.week][S.day].title} is ready.</p><div class="actions"><button onclick="page('train')">Start ${S.day.slice(0,3)}</button><button class="secondary" onclick="page('progress')">Progress</button></div></section><main><div class="grid"><div class="stat"><b>${c.p}%</b><small>Today</small></div><div class="stat"><b>${total}</b><small>Sets logged</small></div><div class="stat"><b>${S.history.length}</b><small>Sessions</small></div><div class="stat"><b>${Object.keys(S.prs).length}</b><small>PRs</small></div></div><div class="title"><h2>This week</h2><span class="muted">${PHASE[S.week]}</span></div>${ds}</main>`}
function pickers(){return `<div class="weekstrip">${Array.from({length:8},(_,i)=>i+1).map(w=>`<button class="week ${w===S.week?'active':''}" onclick="S.week=${w};save();train()"><b>W${w}</b>${PHASE[w]}</button>`).join("")}</div><div class="daystrip">${DAYS.map(d=>`<button class="week ${d===S.day?'active':''}" onclick="S.day='${d}';save();train()"><b>${d.slice(0,3)}</b>${PLAN[S.week][d].title.split(" ")[0]}</button>`).join("")}</div>`}
function prepCard(title,items,kind){if(!items||!items.length)return "";return `<div class="card prep ${kind}"><div class="title"><h2>${kind==='warm'?'🔥':'🧘'} ${title}</h2><span class="muted">Checklist</span></div>${items.map(x=>`<label class="checkrow"><input type="checkbox" onchange="this.parentElement.classList.toggle('checked',this.checked)"><span>${esc(x)}</span></label>`).join('')}</div>`}
function coreCard(d){if(!CORE[d])return "";return `<div class="card core-card"><div class="title"><h2>💪 Core</h2><span class="pill purple">${d==='Friday'?'Optional':'Planned'}</span></div><p class="muted">${CORE[d]}</p><p style="font-size:12px">Choose the core exercises you enjoy. This section is intentionally not logged as programmed sets.</p></div>`}
function train(){let d=PLAN[S.week][S.day],c=comp(S.week,S.day);document.getElementById("root").innerHTML=`<main><div class="title"><h2>Training</h2><span>${c.b}/${c.a} sets</span></div>${pickers()}<div class="workout"><div class="ey">${PHASE[S.week]} · ${S.day}</div><h2>${d.title}</h2><div class="muted">${d.focus}</div><div class="muted" style="font-size:11px;margin-top:7px">Each set has its own weight, reps, RIR, and completion check.</div><div class="bar"><i style="width:${c.p}%"></i></div></div>${prepCard('Warm-Up',WARMUP[S.day],'warm')}${(d.ex||[]).map((x,i)=>exercise(x,i)).join('')}${coreCard(S.day)}${prepCard('Cool-Down',COOLDOWN[S.day],'cool')}<div class="card"><div class="title"><h2>Session notes</h2></div><textarea class="inp" onchange="S.notes['${S.week}|${S.day}']=this.value;save()" placeholder="Energy, technique, wins...">${esc(S.notes[S.week+"|"+S.day]||"")}</textarea></div><button style="width:100%" onclick="finish()">Finish workout</button></main>`}
function exercise(x,i){
  let[name,cat,pres,rest]=x,n=ns(pres),done=0;
  for(let s=0;s<n;s++) if(S.logs[K(S.week,S.day,i,s)]?.done) done++;
  let rows="";
  if(!/min|Zone 2|rounds|easy cardio|Skip/i.test(pres)){
    rows += `<div class="sethead"><span>Set</span><span>Weight</span><span>Reps</span><span>RIR</span><span></span></div>`;
    rows += `<div class="sets-note">Log each set separately — you can change the weight from set to set.</div>`;
    for(let s=0;s<n;s++){
      let L=S.logs[K(S.week,S.day,i,s)]||{};
      rows += `<div class="set">
        <span class="setlabel">Set ${s+1}</span>
        <input class="inp" inputmode="decimal" aria-label="${esc(name)} set ${s+1} weight" placeholder="${S.units}" value="${esc(L.weight||"")}" onchange="log('${K(S.week,S.day,i,s)}','weight',this.value)">
        <input class="inp" inputmode="numeric" aria-label="${esc(name)} set ${s+1} reps" placeholder="reps" value="${esc(L.reps||"")}" onchange="log('${K(S.week,S.day,i,s)}','reps',this.value)">
        <input class="inp" inputmode="numeric" aria-label="${esc(name)} set ${s+1} RIR" placeholder="RIR" value="${esc(L.rir??"")}" onchange="log('${K(S.week,S.day,i,s)}','rir',this.value)">
        <button class="check ${L.done?'on':''}" aria-label="${L.done?'Uncomplete':'Complete'} ${name} set ${s+1}" onclick="toggle('${K(S.week,S.day,i,s)}','${esc(name)}')">${L.done?'✓':'○'}</button>
      </div>`;
    }
  }else{
    let L=S.logs[K(S.week,S.day,i,0)]||{};
    rows=`<div class="set" style="grid-template-columns:44px minmax(0,1fr) 42px">
      <span class="setlabel">Result</span>
      <input class="inp" aria-label="${esc(name)} result or notes" placeholder="Result / notes" value="${esc(L.result||"")}" onchange="log('${K(S.week,S.day,i,0)}','result',this.value)">
      <button class="check ${L.done?'on':''}" aria-label="${L.done?'Uncomplete':'Complete'} ${name}" onclick="toggle('${K(S.week,S.day,i,0)}','${esc(name)}')">${L.done?'✓':'○'}</button>
    </div>`;
  }
  return `<article class="ex ${done===n?'done':''}">
    <div class="exhead">
      <div style="display:flex;justify-content:space-between">
        <div><div class="exname">${name}</div><div class="pres">${pres}</div></div>
        <span class="pill">${done}/${n}</span>
      </div>
      <div class="meta"><span class="pill purple">${cat}</span><span class="pill">${rest}</span></div>
      <div class="actions" style="margin-top:9px">
        <button class="ghost" onclick="how('${esc(name)}')">How to</button>
        <button class="ghost" onclick="last('${esc(name)}')">Last time</button>
      </div>
    </div>
    <div class="sets">${rows}</div>
  </article>`
}
function log(k,f,v){S.logs[k]=S.logs[k]||{};S.logs[k][f]=v;save()}
function toggle(k,name){S.logs[k]=S.logs[k]||{};S.logs[k].done=!S.logs[k].done;if(S.logs[k].done){let v=parseFloat(S.logs[k].weight);if(v&&(!S.prs[name]||v>S.prs[name])){S.prs[name]=v;toast("New PR · "+name)}}save();train()}
function finish(){let c=comp(S.week,S.day);if(c.b){S.history.push({date:new Date().toISOString(),week:S.week,day:S.day,pct:c.p,notes:S.notes[S.week+"|"+S.day]||""});save();toast("Workout saved")}else toast("Log a set first")}
function how(name){let q=INFO[name]||"Use controlled, repeatable technique.";document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeM()">Close</button><div class="ey">Exercise guide</div><h2>${name}</h2><div class="card" style="text-align:center;padding:42px 12px">Demo area<br><span class="muted">Add your preferred video URL to this exercise guide when customizing the app.</span></div><p class="muted">${q}</p><p class="muted" style="font-size:12px">Prioritize the programmed RIR and stop for sharp pain.</p>`;document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show")}
function last(name){let found=[];for(let [k,v] of Object.entries(S.logs))if(v.weight)found.push(v.weight+" "+S.units+(v.reps?" × "+v.reps:""));toast(found.length?"Previous weighted logs found":"No previous log yet")}
function progress(){let total=0,done=0;for(let w=1;w<=8;w++)for(let d of DAYS){let c=comp(w,d);total+=c.a;done+=c.b}let p=total?Math.round(done/total*100):0;let weeks=Array.from({length:8},(_,i)=>{let w=i+1,t=0,dn=0;for(let d of DAYS){let c=comp(w,d);t+=c.a;dn+=c.b}let q=t?Math.round(dn/t*100):0;return `<div class="card"><div style="display:flex;justify-content:space-between"><b>Week ${w}</b><span class="pill ${q===100?'green':'purple'}">${q}%</span></div><div class="muted" style="font-size:12px">${PHASE[w]}</div><div class="bar"><i style="width:${q}%"></i></div></div>`}).join("");let prs=Object.entries(S.prs).map(([n,v])=>`<div class="stat"><b>${v}</b><small>${esc(n)} · ${S.units}</small></div>`).join("");document.getElementById("root").innerHTML=`<main><div class="title"><h2>Progress</h2><span>${done}/${total} sets</span></div><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">Program completion</div><h2>${p}%</h2><div class="muted">All 8 weeks</div></div><div class="ring" style="--p:${p}%"><span>${p}%</span></div></div><div class="title"><h2>Personal records</h2></div>${prs?`<div class="grid">${prs}</div>`:'<div class="card muted">Log weighted sets to build your PR board.</div>'}<div class="title"><h2>Weekly completion</h2></div>${weeks}<div class="title"><h2>Week ${S.week} check-in</h2></div><div class="card">${checkin()}</div></main>`}
function checkin(){let c=S.checkins[S.week]||{},fs=[["weight","Average weight"],["waist","Waist"],["sleep","Sleep 1–5"],["energy","Energy 1–5"],["recovery","Recovery 1–5"],["best","Best lift / benchmark"],["cardio","Cardio notes"],["symptoms","Cycle / symptoms"],["wins","Wins / observations"]];return fs.map(f=>`<label class="muted" style="font-size:12px;margin:9px 0 5px">${f[1]}</label><input id="ci-${f[0]}" class="inp" value="${esc(c[f[0]]||"")}">`).join("")+`<button style="width:100%;margin-top:10px" onclick="saveCI()">Save check-in</button>`}
function saveCI(){let o={};["weight","waist","sleep","energy","recovery","best","cardio","symptoms","wins"].forEach(f=>o[f]=document.getElementById("ci-"+f).value);S.checkins[S.week]=o;save();toast("Check-in saved")}
function history(){let h=S.history.slice().reverse().map(x=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${new Date(x.date).toLocaleDateString()}</b><div class="muted">Week ${x.week} · ${x.day}</div></div><span class="pill green">${x.pct}%</span></div>${x.notes?`<p class="muted">${esc(x.notes)}</p>`:""}</div>`).join("");document.getElementById("root").innerHTML=`<main><div class="title"><h2>Workout history</h2><span>${S.history.length} sessions</span></div>${h||'<div class="card muted" style="text-align:center">Completed workouts will appear here.</div>'}</main>`}
function more(){document.getElementById("root").innerHTML=`<main><div class="title"><h2>More</h2><span>Settings & backup</span></div><div class="card"><b>Program start date</b><input id="date" type="date" class="inp" style="margin-top:9px" value="${esc(S.startDate)}" onchange="S.startDate=this.value;save()"><p class="muted" style="font-size:12px">Reference date for your program.</p></div><div class="card"><b>Backup</b><div class="actions" style="margin-top:10px"><button onclick="exportData()">Export JSON</button><label class="btn secondary">Import JSON<input hidden type="file" accept=".json" onchange="importData(this.files[0])"></label></div></div><div class="card"><b>Install STRONG</b><p class="muted" style="font-size:12px">On iPhone: open the HTTPS site in Safari → Share → Add to Home Screen.</p><button class="secondary" onclick="install()">Install</button></div><div class="card"><b>Units</b><div class="actions" style="margin-top:10px"><button onclick="S.units='lb';save();more()">lb</button><button onclick="S.units='kg';save();more()">kg</button></div></div><div class="card"><button class="ghost" onclick="if(confirm('Reset all app data?')){localStorage.removeItem(KEY);location.reload()}">Reset app data</button></div></main>`}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="strong-v2-backup.json";a.click()}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();location.reload()}catch(e){toast("Invalid backup")}};r.readAsText(f)}
let deferred=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});function install(){if(deferred){deferred.prompt();deferred=null}else toast("Use Add to Home Screen / Install in browser")}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).catch(()=>{}));page("home");
</script></body></html>
